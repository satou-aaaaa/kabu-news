<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'">
<title>株ニュース5本勝負</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="会社のニュースを見て、株が上がるか下がるかを決める1日5本のゲーム。会社とニュースは架空、本当のお金は使いません。">
<meta name="theme-color" content="#161a33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* 夜の取引所。会社は紙の銘柄カード、上げは赤・下げは青（日本の相場の色） */
:root{
  --stage:#161a33; --stage2:#26215a; --paper:#f6efe0; --ink:#211a14; --ink2:#6b6157;
  --gold:#f4c04e; --up:#e5483d; --down:#3c7fe0; --muted:#b9b4d6; --line:#ffffff26; --panel:#00000038;
  --f-disp:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,var(--stage2),var(--stage) 70%) fixed;background-color:var(--stage);color:var(--paper);font-family:var(--f-body);font-weight:500;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px;display:flex;flex-direction:column;gap:14px;min-height:100%;box-sizing:border-box}
.tape{overflow:hidden;white-space:nowrap;border-block:1px solid var(--line);background:var(--panel);font-variant-numeric:tabular-nums;font-size:13px}
.tape span{display:inline-block;padding:6px 0;animation:tape 50s linear infinite}
.tape b{margin:0 16px 0 4px;font-weight:700}
.u{color:var(--up)}.d{color:var(--down)}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(16px,5.4vw,21px);margin:0;color:var(--gold);white-space:nowrap;min-width:0}
h1 button{all:unset;cursor:pointer}
.hd-r{display:flex;align-items:center;gap:8px}
.money{font-variant-numeric:tabular-nums;font-weight:900;font-size:clamp(13px,4vw,15px);white-space:nowrap}
.hd-r{flex-shrink:0}
@media (max-width:360px){.money small{display:none}}
.money small{color:var(--muted);font-weight:500;margin-right:4px}
.icon{all:unset;cursor:pointer;font-size:18px;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line)}
.icon:focus-visible{outline:2px solid var(--gold)}
.col{display:flex;flex-direction:column;gap:14px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--gold)}.steps i.hit{background:var(--up)}.steps i.miss{background:var(--down)}.steps i.pass{background:var(--muted)}
.card{background:var(--paper);color:var(--ink);border-radius:8px;padding:14px 16px 10px;box-shadow:0 10px 0 #00000040;position:relative}
.card.flip{animation:flip .45s ease-out;transform-origin:top center}
@keyframes flip{from{transform:rotateX(-75deg);opacity:.2}to{transform:none;opacity:1}}
.co{display:flex;align-items:center;gap:10px}
.co .em{font-size:30px}
.co h2{font-family:var(--f-disp);font-weight:400;font-size:24px;margin:0;line-height:1.15}
.co h2 small{display:block;font-family:var(--f-body);font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.08em}
.price{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;font-weight:900;font-size:19px;white-space:nowrap}
.price small{display:block;font-size:11px;color:var(--ink2);font-weight:500}
svg.chart{width:100%;height:110px;display:block;margin-top:6px}
.news{background:var(--panel);border-left:4px solid var(--gold);padding:12px 14px;border-radius:4px;font-size:18px;font-weight:700;line-height:1.5;min-height:3em}
.news small{display:block;font-size:11px;color:var(--gold);letter-spacing:.14em;font-weight:900;margin-bottom:2px}
.news .typed{display:inline}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:14px 10px;font-weight:900;font-size:17px;color:#fff;transition:transform .08s}
button:active{transform:translateY(3px)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.buy{background:var(--up);box-shadow:0 5px 0 #9c2a22}
.sell{background:var(--down);box-shadow:0 5px 0 #24528f}
.buy small,.sell small{display:block;font-size:11px;font-weight:700;opacity:.85}
.pass{grid-column:1/-1;background:transparent;border:1px solid var(--line);color:var(--muted);font-size:14px;padding:10px}
.main{background:var(--gold);color:var(--ink);box-shadow:0 5px 0 #a87d1e;width:100%}
.ghost{background:transparent;border:1px solid var(--line);color:var(--paper);width:100%;font-size:14px;padding:12px}
.allin{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.allin input{position:absolute;opacity:0}
.allin .sw{width:44px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .2s}
.allin .sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--paper);transition:left .2s}
.allin input:checked+.sw{background:var(--up)}.allin input:checked+.sw::after{left:23px}
.allin input:focus-visible+.sw{outline:2px solid var(--gold)}
.allin b{color:var(--paper)}
.result{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.big{font-family:var(--f-disp);font-size:46px;line-height:1.1;font-variant-numeric:tabular-nums}
.why{font-size:17px;font-weight:700}
.gain{font-variant-numeric:tabular-nums;font-weight:900;font-size:18px}
.stamp{display:inline-block;font-family:var(--f-disp);font-size:20px;padding:3px 14px;border:3px solid currentColor;border-radius:6px;transform:rotate(-5deg);animation:stamp .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:scale(2.2) rotate(-5deg);opacity:0}}
.term{background:var(--panel);border-radius:8px;padding:10px 12px;text-align:left;font-size:14px;line-height:1.6;width:100%;box-sizing:border-box}
.term b{color:var(--gold);margin-right:6px}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.center{text-align:center}
.lead{font-size:17px;line-height:1.7;font-weight:700;margin:0}
.rank{font-family:var(--f-disp);font-size:30px;color:var(--gold)}
.share{font-variant-numeric:tabular-nums;background:var(--panel);border-radius:8px;padding:12px;white-space:pre-line;font-size:15px;line-height:1.6;text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stats div{background:var(--panel);border-radius:8px;padding:8px 2px}
.stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stats small{font-size:11px;color:var(--muted)}
.week{display:flex;align-items:flex-end;gap:6px;height:72px;padding:0 4px;border-bottom:1px solid var(--line)}
.week div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--muted);gap:2px}
.week i{display:block;width:100%;border-radius:3px 3px 0 0;min-height:2px}
.sec{font-size:12px;color:var(--muted);letter-spacing:.1em;font-weight:700;margin:0}
.words{display:flex;flex-direction:column;gap:6px}
.note{font-size:11px;color:var(--muted);text-align:center;margin:auto 0 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:8px 16px;border-radius:20px;font-weight:700;z-index:5}
.howto{display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.6}
.howto p{margin:0}
canvas#fx{position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:4}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="tape" aria-hidden="true"><span id="tape"></span></div>
<div class="wrap">
  <header><h1><button id="home" aria-label="はじめの画面へ">株ニュース5本勝負</button></h1>
    <div class="hd-r"><div class="money" id="money"></div><button class="icon" id="snd" aria-label="音"></button></div></header>
  <main id="screen" class="col"></main>
  <p class="note">会社とニュースは架空です。本当のお金は使いません。</p>
</div>
<canvas id="fx"></canvas>
<div class="toast" id="toast" role="status" hidden></div>
<script src="data.js"></script>
<script>
const {COMPANIES,EVENTS,TERMS}=window.KABU_DATA;
const TURNS=5, START=1000000, KEY="kabu-news-v1";
const RANKS=[[40,"一流トレーダー"],[20,"腕利きの投資家"],[5,"堅実な投資家"],[-5,"ほぼトントン"],[-20,"少し負け越し"],[-999,"大損"]];

// ---- 乱数と日付 ----
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function seedOf(str){let h=2166136261;for(const ch of str){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function jstDay(off=0){return new Date(Date.now()+9*3600e3-off*864e5).toISOString().slice(0,10)}
// 1回分の5本。会社は重ねない。上げと下げは最低1本ずつ入れる（全部同じ向きだと読みが要らなくなる）
function build(seed){
  const r=rng(seed);
  for(let tries=0;;tries++){
    const pool=EVENTS.map((e,i)=>i);
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
    const used=new Set(),picks=[];
    for(const i of pool){const e=EVENTS[i];if(used.has(e.c))continue;used.add(e.c);picks.push(e);if(picks.length===TURNS)break}
    const ups=picks.filter(e=>e.p>0).length;
    if((ups>0&&ups<TURNS)||tries>20) return picks.map(e=>{const base=400+Math.floor(r()*36)*100,h=[base];
      for(let k=0;k<11;k++)h.push(Math.max(50,Math.round(h[k]*(1+(r()-.5)*.07))));return{...e,hist:h}});
  }
}

// ---- 記録（端末の中だけ） ----
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return{}}}
function save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch{}}
let REC=Object.assign({days:{},best:0,hits:0,bets:0,plays:0,sound:false,words:{}},load());
function streak(){let n=0;for(let i=REC.days[jstDay()]?0:1;REC.days[jstDay(i)];i++)n++;return n}

// ---- 音（押したときだけ鳴らす） ----
let AC=null;
function beep(kind){if(!REC.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const seq={hit:[[660,.08],[880,.08],[1320,.16]],miss:[[300,.12],[200,.22]],tap:[[520,.04]],end:[[523,.1],[659,.1],[784,.1],[1047,.3]]}[kind];
  let t=AC.currentTime;for(const[f,d]of seq){const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.9}}catch{}}
function sndIcon(){$("snd").textContent=REC.sound?"🔊":"🔇";$("snd").setAttribute("aria-label",REC.sound?"音を消す":"音を出す")}

// ---- 表示の道具 ----
const $=id=>document.getElementById(id);
const man=v=>(Math.round(v/1000)/10).toLocaleString("ja-JP",{maximumFractionDigits:1})+"万円";
const sign=v=>v>=0?"+":"−";
let G=null;
function countUp(el,from,to,fmt,ms=700){if(matchMedia("(prefers-reduced-motion: reduce)").matches){el.textContent=fmt(to);return}
  const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(f)})(t0)}
function setMoney(animFrom){const el=$("money");if(!G){el.innerHTML="";return}
  el.innerHTML=`<small>持ち金</small><span id="mv"></span>`;
  if(animFrom!=null)countUp($("mv"),animFrom,G.money,man);else $("mv").textContent=man(G.money)}
function tape(){const r=rng(seedOf(jstDay()));const s=COMPANIES.map(c=>{const p=((r()*4+.2)*(r()<.5?-1:1)).toFixed(1);
  return `${c.n}<b class="${p>0?"u":"d"}">${p>0?"▲":"▼"}${Math.abs(p)}%</b>`}).join("");$("tape").innerHTML=s+s}
function steps(){return `<div class="steps">${G.list.map((_,i)=>`<i class="${G.marks[i]?{"🎯":"hit","💥":"miss","😶":"pass"}[G.marks[i]]:i===G.t?"on":""}"></i>`).join("")}</div>`}
function coHead(e,price){const c=COMPANIES[e.c];return `<div class="co"><span class="em" aria-hidden="true">${c.e}</span><h2><small>${c.s}</small>${c.n}</h2><div class="price"><span id="pv">${price.toLocaleString()}</span>円<small>いまの株価</small></div></div>`}
function chart(hist,next){
  const all=next==null?hist:[...hist,next],lo=Math.min(...all)*.97,hi=Math.max(...all)*1.03,W=300,H=100,n=hist.length;
  const x=i=>i*(W/n),y=v=>H-(v-lo)/(hi-lo)*H,pts=hist.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const area=`<polygon points="0,${H} ${pts} ${x(n-1).toFixed(1)},${H}" fill="#211a1414"/>`;
  const grid=[.25,.5,.75].map(k=>`<line x1="0" x2="${W}" y1="${H*k}" y2="${H*k}" stroke="#211a1418" stroke-width="1"/>`).join("");
  let seg;
  if(next!=null){const col=next>=hist[n-1]?"var(--up)":"var(--down)";
    seg=`<line x1="${x(n-1)}" y1="${y(hist[n-1])}" x2="${x(n)}" y2="${y(next)}" stroke="${col}" stroke-width="4" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur=".7s" fill="freeze"/></line><circle cx="${x(n)}" cy="${y(next)}" r="5" fill="${col}"><animate attributeName="r" values="0;0;5" keyTimes="0;.9;1" dur=".75s"/></circle>`}
  else seg=`<line x1="${x(n-1)}" x2="${x(n)}" y1="${y(hist[n-1])}" y2="${y(hist[n-1])}" stroke="#211a1460" stroke-width="2" stroke-dasharray="4 4"/><text x="${x(n)}" y="${y(hist[n-1])-8}" text-anchor="end" font-size="16" fill="#6b6157" font-weight="900">？</text>`;
  return `<svg class="chart" viewBox="-6 -10 ${W+12} ${H+16}" preserveAspectRatio="none" role="img" aria-label="株価の動き">${grid}${area}<polyline points="${pts}" fill="none" stroke="#211a14" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${seg}</svg>`}

// ---- 画面 ----
function home(){
  G=null;setMoney();const today=REC.days[jstDay()],acc=REC.bets?Math.round(REC.hits/REC.bets*100):0;
  const week=[...Array(7)].map((_,i)=>{const d=jstDay(6-i),r=REC.days[d];return{d,r}});
  const maxAbs=Math.max(10,...week.map(w=>w.r?Math.abs(w.r.pct):0));
  $("screen").innerHTML=`
    <p class="lead center">会社のニュースを見て<br>株が<span class="u">上がる</span>か<span class="d">下がる</span>かを決めよう。<br>今日の5本で、100万円をどこまで増やせる？</p>
    ${today?`<div class="share">今日の結果\n${today.text}</div>`:""}
    <button class="main" id="go">${today?"練習でもう一回":REC.cur&&REC.cur.day===jstDay()?`今日の5本の続き（${REC.cur.t+1}本目から）`:"今日の5本をはじめる"}</button>
    ${today?`<button class="ghost" id="copy">今日の結果をコピー</button>`:""}
    <p class="sec">あなたの記録</p>
    <div class="stats"><div><b>${REC.plays}</b><small>遊んだ日</small></div><div><b>${streak()}</b><small>連続日数</small></div>
      <div><b>${acc}%</b><small>的中率</small></div><div><b>${REC.best?man(REC.best).replace("万円",""):"-"}</b><small>最高(万円)</small></div></div>
    <div class="week" aria-label="この7日の成績">${week.map(w=>`<div>${w.r?`<span class="${w.r.pct>=0?"u":"d"}">${sign(w.r.pct)}${Math.abs(w.r.pct)}</span><i style="height:${Math.abs(w.r.pct)/maxAbs*48+2}px;background:var(--${w.r.pct>=0?"up":"down"})"></i>`:`<i style="background:var(--line)"></i>`}${+w.d.slice(8)}日</div>`).join("")}</div>
    <button class="ghost" id="how">遊び方と覚えた言葉</button>`;
  $("go").onclick=()=>start(!today);$("how").onclick=howto;
  if(today)$("copy").onclick=()=>copy(today.text);
}
function howto(){
  const ws=Object.keys(REC.words);
  $("screen").innerHTML=`<div class="howto">
    <p>1. ニュースを読んで、株が上がると思えば<b class="u">買う</b>、下がると思えば<b class="d">売る</b>。</p>
    <p>2. 当たれば持ち金が増え、外れれば減ります。ふだんは持ち金の半分、<b>全力</b>にすると全部で勝負します。</p>
    <p>3. 自信がなければ見送れます。お金は動きません。</p>
    <p>4. 「今日の5本」はだれでも同じ問題で、1日1回。練習は何度でも遊べます。</p>
    <p class="sec">覚えた言葉（${ws.length}/${Object.keys(TERMS).length}）</p>
    <div class="words">${ws.length?ws.map(k=>`<div class="term"><b>${TERMS[k][0]}</b>${TERMS[k][1]}</div>`).join(""):`<div class="term">遊ぶと、ニュースに出てきた株の言葉がここにたまります。</div>`}</div>
    <button class="main" id="back">もどる</button>
    <p class="note">気に入ったら <a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener" style="color:var(--gold)">Ko-fi で応援</a>（遊ぶのはずっと無料）</p></div>`;
  $("back").onclick=home;
}
function start(daily){
  const cur=REC.cur&&REC.cur.day===jstDay()?REC.cur:null;
  if(daily&&cur){G={...cur,daily:true,list:build(cur.seed)};beep("tap");G.t<TURNS?turn():end();return}
  const seed=daily?seedOf(jstDay()):Math.floor(Math.random()*2**31);
  G={daily,seed,list:build(seed),t:0,money:START,marks:[],allIn:false,words:[],bets:0,hits:0};beep("tap");turn();
}
// 今日の5本は1本ずつ記録して、途中で閉じても続きから（やり直しで結果を変えられないように）
function saveCur(){if(!G.daily)return;const{list,...rest}=G;REC.cur={...rest,day:jstDay()};save(REC)}
function turn(){
  const e=G.list[G.t],now=e.hist.at(-1);setMoney();
  $("screen").innerHTML=`${steps()}
    <div class="card flip">${coHead(e,now)}${chart(e.hist)}</div>
    <div class="news" aria-live="polite"><small>ニュース ${G.t+1}/${TURNS}</small><span class="typed" id="nw"></span></div>
    <div class="acts">
      <button class="buy" id="buy">買う<small>上がると思う</small></button><button class="sell" id="sell">売る<small>下がると思う</small></button>
      <button class="pass" id="pass">今回は見送る</button></div>
    <label class="allin"><input type="checkbox" id="all" ${G.allIn?"checked":""}><span class="sw"></span><span><b>全力</b>（持ち金ぜんぶで勝負）</span></label>`;
  typeText($("nw"),e.n);
  $("all").onchange=ev=>{G.allIn=ev.target.checked;beep("tap")};
  $("buy").onclick=()=>pick(1);$("sell").onclick=()=>pick(-1);$("pass").onclick=()=>pick(0);
}
function typeText(el,s){if(matchMedia("(prefers-reduced-motion: reduce)").matches){el.textContent=s;return}
  let i=0;el.textContent="";clearInterval(typeText.h);typeText.h=setInterval(()=>{el.textContent=s.slice(0,++i);if(i>=s.length)clearInterval(typeText.h)},28)}
function pick(side){
  clearInterval(typeText.h);
  const e=G.list[G.t],now=e.hist.at(-1),next=Math.round(now*(1+e.p/100));
  const bet=G.money*(G.allIn?1:.5),gain=Math.round(bet*side*e.p/100),before=G.money;
  G.money+=gain;const hit=side!==0&&Math.sign(e.p)===side;
  G.marks.push(side===0?"😶":hit?"🎯":"💥");if(!G.words.includes(e.t))G.words.push(e.t);
  if(side!==0){G.bets++;G.hits+=hit?1:0}
  setMoney(before);
  const col=e.p>=0?"u":"d",[tn,td]=TERMS[e.t];
  $("screen").innerHTML=`${steps()}
    <div class="card" id="card">${coHead(e,next)}${chart(e.hist,next)}</div>
    <div class="result">
      <div class="big ${col}" id="pct">${e.p>=0?"▲":"▼"}0%</div>
      <div class="why">${e.o}</div>
      <div>${side===0?`<span class="stamp" style="color:var(--muted)">見送り</span>`:hit?`<span class="stamp u">的中！</span>`:`<span class="stamp d">はずれ</span>`}</div>
      <div class="gain ${gain>=0?"u":"d"}">${side===0?"お金は動かず":sign(gain)+man(Math.abs(gain))}${G.allIn&&side?"（全力）":""}</div>
      <div class="term"><b>${tn}</b>${td}</div>
    </div>
    <button class="main" id="next">${G.t+1<TURNS?"次のニュース":"結果を見る"}</button>`;
  countUp($("pct"),0,Math.abs(e.p),v=>`${e.p>=0?"▲":"▼"}${Math.round(v)}%`,600);
  countUp($("pv"),now,next,v=>Math.round(v).toLocaleString(),600);
  if(side===0)beep("tap");else if(hit){beep("hit");if(Math.abs(e.p)>=12||G.allIn)confetti()}else{beep("miss");$("card").classList.add("shake")}
  G.t++;saveCur();
  $("next").onclick=()=>{G.t<TURNS?turn():end()};$("next").focus({preventScroll:true});
}
function end(){
  const pct=Math.round((G.money/START-1)*100),rank=RANKS.find(r=>pct>=r[0])[1];
  const d=jstDay().slice(5).replace("-","/").replace(/^0/,"").replace("/0","/");
  const url=/^https:/.test(location.protocol)&&/github\.io$/.test(location.hostname)?"\n"+location.origin+location.pathname:"";
  const text=`株ニュース5本勝負 ${G.daily?d:"練習"}\n${G.marks.join("")}\n100万円 → ${man(G.money)}（${pct>=0?"+":""}${pct}%）\n${rank}${url}`;
  if(G.daily&&!REC.days[jstDay()]){REC.days[jstDay()]={pct,marks:G.marks.join(""),text};REC.plays++;REC.hits+=G.hits;REC.bets+=G.bets}
  if(G.daily)delete REC.cur;
  if(G.money>REC.best)REC.best=G.money;
  const fresh=G.words.filter(w=>!REC.words[w]);for(const w of G.words)REC.words[w]=1;save(REC);
  $("screen").innerHTML=`<div class="col center">
    <div class="rank">${rank}</div>
    <div class="big ${pct>=0?"u":"d"}" id="tot">0%</div>
    <div class="share">${text.replace(url,"")}</div>
    <button class="main" id="copy">結果をコピーして見せる</button>
    <p class="sec">今日出てきた言葉${fresh.length?`（新しく${fresh.length}つ）`:""}</p>
    <div class="words">${G.words.map(k=>`<div class="term"><b>${TERMS[k][0]}</b>${TERMS[k][1]}</div>`).join("")}</div>
    <button class="ghost" id="again">練習でもう一回</button>
    <button class="ghost" id="tohome">記録を見る</button></div>`;
  countUp($("tot"),0,pct,v=>`${v>=0?"+":"−"}${Math.abs(Math.round(v))}%`,900);
  beep("end");if(pct>=20)confetti();
  $("copy").onclick=()=>copy(text);$("again").onclick=()=>start(false);$("tohome").onclick=home;
}
function copy(text){const ok=()=>toast("コピーしました");
  if(navigator.clipboard)navigator.clipboard.writeText(text).then(ok,()=>fallback(text));else fallback(text)}
function fallback(text){const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand("copy")}catch{}t.remove();toast(ok?"コピーしました":"コピーできませんでした。結果の文を長押ししてね")}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800)}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=$("fx"),x=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#f4c04e","#e5483d","#f6efe0","#3c7fe0"],P=Array.from({length:90},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,v:2+Math.random()*3,a:Math.random()*6,s:5+Math.random()*6,c:cols[Math.floor(Math.random()*4)]}));
  let f=0;cancelAnimationFrame(confetti.h);(function draw(){x.clearRect(0,0,cv.width,cv.height);for(const p of P){p.y+=p.v;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x+Math.sin(p.a)*8,p.y);x.rotate(p.a);x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()}if(++f<150)confetti.h=requestAnimationFrame(draw);else x.clearRect(0,0,cv.width,cv.height)})()}
// キーボード：1=買う 2=売る 3=見送る Enter=次へ
addEventListener("keydown",ev=>{if(ev.target.tagName==="INPUT")return;const m={"1":"buy","2":"sell","3":"pass"}[ev.key];if(m&&$(m)){ev.preventDefault();$(m).click()}});
$("snd").onclick=()=>{REC.sound=!REC.sound;save(REC);sndIcon();beep("tap")};
$("home").onclick=()=>{clearInterval(typeText.h);home()};
if("serviceWorker" in navigator&&location.protocol==="https:"&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register("sw.js").catch(()=>{});
window.__kabu={build,EVENTS,COMPANIES,TERMS,TURNS};
tape();sndIcon();home();
</script>

<style>
/* 夜の取引所。会社は紙の銘柄カード、上げは赤・下げは青（日本の相場の色） */
:root{
  --stage:#161a33; --stage2:#26215a; --paper:#f6efe0; --ink:#211a14; --ink2:#6b6157;
  --gold:#f4c04e; --up:#ff6b5e; --down:#5b9bff; --muted:#b9b4d6; --line:#ffffff26; --panel:#00000038;
  --f-disp:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,var(--stage2),var(--stage) 70%) fixed;background-color:var(--stage);color:var(--paper);font-family:var(--f-body);font-weight:500;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px;display:flex;flex-direction:column;gap:14px;min-height:100%;box-sizing:border-box}
.tape{overflow:hidden;white-space:nowrap;border-block:1px solid var(--line);background:var(--panel);font-variant-numeric:tabular-nums;font-size:13px}
.tape span{display:inline-block;padding:6px 0;animation:tape 50s linear infinite}
.tape b{margin:0 16px 0 4px;font-weight:700}
.u{color:var(--up)}.d{color:var(--down)}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(16px,5.4vw,21px);margin:0;color:var(--gold);white-space:nowrap;min-width:0}
h1 button{all:unset;cursor:pointer}
.hd-r{display:flex;align-items:center;gap:8px}
.money{font-variant-numeric:tabular-nums;font-weight:900;font-size:clamp(13px,4vw,15px);white-space:nowrap}
.hd-r{flex-shrink:0}
@media (max-width:360px){.money small{display:none}}
.money small{color:var(--muted);font-weight:500;margin-right:4px}
.icon{all:unset;cursor:pointer;font-size:18px;width:44px;height:44px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line)}
.icon:focus-visible{outline:2px solid var(--gold)}
.col{display:flex;flex-direction:column;gap:14px}
.steps{display:flex;gap:6px;align-items:center}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line);font-style:normal;font-size:0;line-height:1;display:grid;place-items:center;box-sizing:border-box}
/* 色だけで分けない：今の1本は太く・的中は塗り・はずれは斜線・見送りは点線の枠 */
.steps i.on{background:var(--gold);height:10px}.steps i.hit{background:var(--up)}.steps i.miss{background:repeating-linear-gradient(135deg,var(--down) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1px var(--down)}.steps i.pass{background:none;border:1px dashed var(--muted)}
.card{background:var(--paper);color:var(--ink);border-radius:8px;padding:14px 16px 10px;box-shadow:0 10px 0 #00000040;position:relative}
.card.flip{animation:flip .45s ease-out;transform-origin:top center}
@keyframes flip{from{transform:rotateX(-75deg);opacity:.2}to{transform:none;opacity:1}}
.co{display:flex;align-items:center;gap:10px}
.co .em{font-size:30px}
.co h2{font-family:var(--f-disp);font-weight:400;font-size:24px;margin:0;line-height:1.15}
.co h2 small{display:block;font-family:var(--f-body);font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.08em}
.price{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;font-weight:900;font-size:19px;white-space:nowrap}
.price small{display:block;font-size:11px;color:var(--ink2);font-weight:500}
svg.chart{width:100%;height:110px;display:block;margin-top:6px}
.news{background:var(--panel);border-left:4px solid var(--gold);padding:12px 14px;border-radius:4px;font-size:18px;font-weight:700;line-height:1.5;min-height:3em}
.news small{display:block;font-size:11px;color:var(--gold);letter-spacing:.14em;font-weight:900;margin-bottom:2px}
.news .typed{display:inline}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:14px 10px;font-weight:900;font-size:17px;color:#fff;transition:transform .08s}
button:active{transform:translateY(3px)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.buy{background:#c93a30;box-shadow:0 5px 0 #8a2620}
.sell{background:#2d68c4;box-shadow:0 5px 0 #1f4a8a}
.buy small,.sell small{display:block;font-size:11px;font-weight:700}
.pass{grid-column:1/-1;background:transparent;border:1px solid var(--line);color:var(--muted);font-size:14px;padding:13px 10px}
.main{background:var(--gold);color:var(--ink);box-shadow:0 5px 0 #a87d1e;width:100%}
.main.alt{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px;background:#f4c04e1f;color:var(--gold);border:2px solid var(--gold);box-shadow:0 5px 0 #a87d1e88}
.main.alt small{font-size:12px;color:var(--muted);font-weight:700}
.ghost{background:transparent;border:1px solid var(--line);color:var(--paper);width:100%;font-size:14px;padding:12px}

.allin .sw{width:44px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .2s}
.allin .sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--paper);transition:left .2s}
.allin input:checked+.sw{background:var(--up)}.allin input:checked+.sw::after{left:23px}
.allin input:focus-visible+.sw{outline:2px solid var(--gold)}
.allin b{color:var(--paper)}
.result{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.big{font-family:var(--f-disp);font-size:46px;line-height:1.1;font-variant-numeric:tabular-nums}
.why{font-size:17px;font-weight:700}
.gain{font-variant-numeric:tabular-nums;font-weight:900;font-size:18px}
.stamp{display:inline-block;font-family:var(--f-disp);font-size:20px;padding:3px 14px;border:3px solid currentColor;border-radius:6px;transform:rotate(-5deg);animation:stamp .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:scale(2.2) rotate(-5deg);opacity:0}}
.term{background:var(--panel);border-radius:8px;padding:10px 12px;text-align:left;font-size:14px;line-height:1.6;width:100%;box-sizing:border-box}
.term b{color:var(--gold);margin-right:6px}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.center{text-align:center}
.lead{font-size:17px;line-height:1.7;font-weight:700;margin:0}
.rank{font-family:var(--f-disp);font-size:30px;color:var(--gold)}
.share{font-variant-numeric:tabular-nums;background:var(--panel);border-radius:8px;padding:12px;white-space:pre-line;font-size:15px;line-height:1.6;text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stats div{background:var(--panel);border-radius:8px;padding:8px 2px}
.stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stats small{font-size:11px;color:var(--muted)}
.week{display:flex;align-items:flex-end;gap:6px;height:72px;padding:0 4px;border-bottom:1px solid var(--line)}
.week div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--muted);gap:2px}
.week i{display:block;width:100%;border-radius:3px 3px 0 0;min-height:2px}
.ttl,.wkbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.ttl b{color:var(--gold);font-size:16px}.ttl small,.wkbox small{color:var(--muted);font-size:12px}
.wkbox .sec{display:flex;justify-content:space-between;gap:8px}.wkbox>div{display:grid;grid-template-columns:24px 1fr 64px 36px;align-items:center;gap:6px;font-size:13px}
.wkbox .bar,.ttl .bar{margin:0}.wkbox>div.got b{color:var(--muted);text-decoration:line-through}.chain{color:var(--gold);font-weight:900}
.mline{width:100%;max-width:300px;height:72px;margin:0 auto;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal small{color:var(--muted);font-size:11px}
.cal i{font-style:normal;font-size:12px;aspect-ratio:1;display:grid;place-items:center;border-radius:6px;background:var(--panel);position:relative;color:var(--muted)}
.cal i:empty{background:none}.cal i.pu{background:#c93a30;color:#fff;font-weight:900}.cal i.pd{background:#2d68c4;color:#fff;font-weight:900}
.cal i.today{outline:2px solid var(--gold)}.cal i[data-s]::after{content:attr(data-s);position:absolute;left:3px;bottom:1px;font-size:8px;line-height:1}.cal i b{position:absolute;right:0;top:-6px;font-size:10px}
.dare{background:var(--panel);border:2px solid var(--gold);border-radius:10px;padding:12px;display:grid;gap:8px;text-align:center}.dare small{color:var(--muted)}
.sec{font-size:12px;color:var(--muted);letter-spacing:.1em;font-weight:700;margin:0}
.words{display:flex;flex-direction:column;gap:6px}
.note{font-size:11px;color:var(--muted);text-align:center;margin:auto 0 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:8px 16px;border-radius:20px;font-weight:700;z-index:5}
.howto{display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.6}
.howto p{margin:0}
.intro{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.intro div{background:var(--panel);border-radius:10px;padding:12px 4px 10px;font-size:13px;font-weight:700;line-height:1.45}
.intro i{display:block;font-style:normal;font-size:26px;margin-bottom:4px}
.sub{font-size:13px;color:var(--muted);text-align:center;margin:0}
.next{font-size:14px;color:var(--muted);text-align:center;margin:0;font-variant-numeric:tabular-nums}
.next b{color:var(--paper)}
.fire{display:inline-block;background:#e5483d26;color:#ffb3a8;border-radius:20px;padding:3px 12px;font-size:13px;font-weight:900}
.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shares a,.shares button{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--paper);font-size:14px;font-weight:900;text-decoration:none;padding:0 6px;box-sizing:border-box}
.recap{display:flex;flex-direction:column;gap:6px;text-align:left}
.recap div{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;background:var(--panel);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.4}
.recap small{display:block;color:var(--muted);font-size:11px}
.recap b{font-variant-numeric:tabular-nums}
.hardbtn{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;min-height:56px;border-radius:12px;border:2px solid var(--gold);background:#f4c04e14;color:var(--gold);font:inherit;font-size:16px;font-weight:900;padding:10px;cursor:pointer;box-sizing:border-box}
.hardbtn small{font-size:12px;color:var(--muted);font-weight:700}
.hardbox{text-align:center;background:var(--panel);border-radius:10px;padding:10px;font-size:14px}
.twist{display:inline-block;background:var(--gold);color:var(--ink);border-radius:6px;font-size:11px;font-weight:900;padding:1px 6px;margin-right:6px;vertical-align:2px}
.more summary{cursor:pointer;color:var(--muted);font-size:13px;padding:10px 0;min-height:24px}.more[open] summary{margin-bottom:8px}
.ach,.zukan{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ach div,.zukan div{background:var(--panel);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.4;border:1px dashed var(--muted)}
.ach div.got,.zukan div:not(.no){border:1px solid var(--gold)}
.ach i,.zukan i{font-style:normal;font-size:24px}
.ach small,.zukan small{color:var(--muted);font-size:11px}
.cobtn{margin-top:6px;min-height:44px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--gold);font:inherit;font-size:12px;font-weight:900;cursor:pointer}.sec small{font-weight:400;letter-spacing:0;margin-left:4px}
.bar{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.bar span{display:block;height:100%;background:var(--gold)}
.newach{display:flex;flex-direction:column;gap:6px}
.newach div{display:flex;align-items:center;gap:10px;background:#f4c04e1f;border:1px solid var(--gold);border-radius:10px;padding:8px 12px;text-align:left}
.newach i{font-style:normal;font-size:26px}.newach small{display:block;color:var(--gold);font-size:11px}
.fb{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--panel);border-radius:12px;padding:12px}

.fb div{display:flex;gap:12px}

.fbtext{color:var(--gold);font-size:13px;min-height:44px;display:flex;align-items:center}
.hint{color:var(--gold)!important}
.qword{font-family:"Dela Gothic One",sans-serif;font-size:30px;text-align:center;color:var(--gold);padding:18px 0}
.qch{display:flex;flex-direction:column;gap:8px}
.qch button{text-align:left;font-size:14px;line-height:1.5;min-height:56px;padding:10px 14px}
.qch button.right{border-color:var(--gold);background:#f4c04e26}
.qch button.wrong{border-color:var(--down);opacity:.7}
.qch button.right::before{content:"✓ 正しい：";font-weight:900;color:var(--gold)}.qch button.wrong::before{content:"✕ ちがう：";font-weight:900}
.sr{position:absolute;left:-9999px;top:auto;width:1px;height:1px;white-space:nowrap;margin:0;padding:0;border:0}
.rival{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;background:var(--panel);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted)}
.rival b{font-size:16px}.rival em{font-style:normal;font-weight:900;color:var(--gold)}
.tmk{display:flex;flex-direction:column;gap:6px;background:var(--panel);border-radius:10px;padding:10px 12px}
.tmk>small{color:var(--muted);font-size:11px}
.tmk div{display:grid;grid-template-columns:7em 1fr 3em;gap:8px;align-items:center;font-size:13px}
.tmk div .bar{margin:0}.tmk div small{color:var(--muted);text-align:right}
/* ひねりを見抜いた・続けて当てたときの手ごたえ */
.stamp.tw{color:var(--gold)}
.combo{margin:0;font-size:13px;font-weight:900;color:var(--gold);animation:stamp .35s cubic-bezier(.2,1.6,.4,1)}
.twsum{display:inline-block;background:#f4c04e1f;color:var(--gold);border-radius:20px;padding:3px 12px;font-size:13px;font-weight:900}

.calnav{display:flex;align-items:center;justify-content:space-between;gap:8px}

.calnav b{font-size:14px}.calnav small{display:block;color:var(--muted);font-size:11px;font-weight:500}
.cal i.lu{box-shadow:inset 0 0 0 2px var(--up);color:var(--paper);font-weight:900}.cal i.ld{box-shadow:inset 0 0 0 2px var(--down);color:var(--paper);font-weight:900}
.cal i.can{box-shadow:inset 0 0 0 1px var(--gold);border:1px dashed var(--gold);box-sizing:border-box;color:var(--gold)}
.callegend{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:11px;color:var(--muted)}

.callegend .k1::before{background:var(--up)}.callegend .k2::before{box-shadow:inset 0 0 0 2px var(--up)}.callegend .k3::before{border:1px dashed var(--gold);box-sizing:border-box}
.latelist{display:flex;flex-direction:column;gap:8px}
.latelist button{min-height:48px}
canvas#fx{position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:4}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 色の見分けを助ける（見やすさの設定）：上げ・下げをカラーユニバーサルデザインの朱と空色に替え、記号を大きくする */

:is(.icon,button,a,summary):focus-visible{outline:2px solid var(--gold)!important;outline-offset:2px}

<script id="a11y-script">
/* 見やすさの設定（色覚・ディスレクシア・弱視・動きに弱い人のため）。外へは何も送らない。
   設定は localStorage の a11y-v1 に置く。同じサイト（satou-aaaaa.github.io）のゲームは同じ設定を使う。
   ゲームの側でできること：
   - 設定を開くボタンに data-a11y-open を付ける（無ければ左下に「Aa」のボタンを出す）
   - 読み上げる文に data-a11y-say を付ける（問題文・知らせなど）
   - 色の見分けを助ける形・模様は html.a11y-cvd の下に CSS で書く。JS では A11y.on('cvd')
   - 揺れ・すべる動きを JS で動かすときは、A11y.on('calm') なら止める
   - 設定が変わると document に a11ychange が届く
   - 設定の印は html の class「a11y-<設定の名前>」（a11y-read など）。部品の class はこれと重ならない名前にする（2026-11-05 a11y-say がボタンとぶつかった） */
(() => {
  const KEY = "a11y-v1";
  const root = document.documentElement;
  const OPTS = [
    ["read", "読みやすい文字", "UD フォント・行間と字間を広く"],
    ["cvd", "色の見分けを助ける", "色に形・模様・記号を足す"],
    ["calm", "動きを減らす", "揺れ・点滅・すべる動きを止める"],
    ["say", "読み上げのボタンを出す", "問題や知らせを声で読む（端末の中の声だけ）"],
    ["ruby", "ふりがなを出す", "むずかしい漢字に読みを付ける"],
  ];
  const media = (q) => { try { return matchMedia(q).matches; } catch { return false; } };
  // 保存した値がオブジェクトでなければ（別のページが書いた・手で直した）無かったことにする（2026-11-05 CodeRabbit：true が入ると設定が開けなくなる）
  const load = () => { try { const v = JSON.parse(localStorage.getItem(KEY) || "{}"); return v && typeof v === "object" && !Array.isArray(v) ? v : {}; } catch { return {}; } };
  let S = load();
  // 決めていないものは端末の設定に合わせる（視差効果を減らす → 動きを減らす）
  const on = (k) => (k in S ? !!S[k] : k === "calm" ? media("(prefers-reduced-motion: reduce)") : false);
  let fontLoaded = false;
  const loadFont = () => {
    if (fontLoaded) return; fontLoaded = true;
    // Google Fonts を許しているページだけ取りに行く（許していなければ端末にある UD フォントを使う）
    const csp = (document.querySelector('meta[http-equiv="Content-Security-Policy"]') || {}).content || "";
    if (csp && !/fonts\.googleapis\.com/.test(csp)) return;
    const l = document.createElement("link");
    l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap";
    document.head.appendChild(l);
  };
  const apply = () => {
    for (const [k] of OPTS) root.classList.toggle("a11y-" + k, on(k));
    if (on("read")) loadFont();
    if (sayBtn) sayBtn.hidden = !on("say");
    if (!on("say")) stop();
  };
  const set = (k, v) => {
    S = { ...S, ...load() }; // 別のタブで変えた設定を消さないよう、書く前に読み直す
    S[k] = !!v;
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { /* 保存できなくても今の画面には効かせる */ }
    apply();
    document.dispatchEvent(new CustomEvent("a11ychange", { detail: { key: k, on: !!v } }));
  };

  // 読み上げ：端末の中の日本語の声だけを使う（外へ文字を送る声は使わない）
  const voice = () => { try { return speechSynthesis.getVoices().find((v) => /^ja/i.test(v.lang) && v.localService) || null; } catch { return null; } };
  const stop = () => { try { speechSynthesis.cancel(); } catch { /* 無い端末 */ } };
  const visible = (el) => { const r = el.getBoundingClientRect(); const cs = getComputedStyle(el); return r.width > 0 && r.height > 0 && cs.visibility !== "hidden" && !el.closest("[hidden],[aria-hidden=true],[inert]"); };
  const textOf = (sel) => [...document.querySelectorAll(sel)].filter(visible).map((el) => (el.getAttribute("aria-label") || el.innerText || "").trim()).filter(Boolean).join("。");
  // data-a11y-say が無い画面では、見出しと知らせの場所を読む（2026-11-05 何も読まれず設定が開くだけだった）
  const sayText = () => textOf("[data-a11y-say]") || textOf("h1,h2,[role=status],[aria-live]");
  const say = (text) => {
    const v = voice();
    if (!v || !text) return false;
    stop();
    const u = new SpeechSynthesisUtterance(text.slice(0, 600));
    u.voice = v; u.lang = v.lang; u.rate = 0.95;
    speechSynthesis.speak(u);
    return true;
  };

  let dlg = null, sayBtn = null, lastFocus = null;
  const build = () => {
    dlg = document.createElement("dialog");
    dlg.className = "a11y-dlg";
    dlg.setAttribute("aria-labelledby", "a11y-h");
    const hasRuby = !!document.querySelector("ruby.a11y-rb");
    dlg.innerHTML = `<h2 id="a11y-h">見やすさ・読みやすさ</h2><p>ほかのゲームにも同じ設定が使われます。文字は2本の指で広げると大きくなります。</p>` +
      OPTS.filter(([k]) => k !== "ruby" || hasRuby).map(([k, n, d]) => `<label><input type="checkbox" data-k="${k}"><span>${n}<small>${d}</small></span></label>`).join("") +
      `<p class="a11y-note" id="a11y-novoice" hidden>この端末には、外へ送らずに読める日本語の声がありません。</p><div class="a11y-row"><button type="button" class="a11y-ok" data-a11y-close>閉じる</button></div>`;
    document.body.appendChild(dlg);
    dlg.addEventListener("change", (e) => {
      const k = e.target.dataset && e.target.dataset.k;
      if (!k) return;
      set(k, e.target.checked);
      if (k === "say") dlg.querySelector("#a11y-novoice").hidden = !(e.target.checked && !voice());
    });
    dlg.querySelector("[data-a11y-close]").addEventListener("click", () => dlg.close());
    dlg.addEventListener("close", () => { if (lastFocus && lastFocus.focus) lastFocus.focus(); });
    sayBtn = document.createElement("button");
    sayBtn.type = "button"; sayBtn.className = "a11y-saybtn"; sayBtn.textContent = "🔊 読む"; sayBtn.setAttribute("aria-label", "画面の問題を読み上げる");
    sayBtn.addEventListener("click", () => {
      try { if (speechSynthesis.speaking) return stop(); } catch { /* 無い端末 */ }
      if (!say(sayText())) open();
    });
    document.body.appendChild(sayBtn);
    if (!document.querySelector("[data-a11y-open]")) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "a11y-btn a11y-float"; b.textContent = "Aa"; b.setAttribute("data-a11y-open", ""); b.setAttribute("aria-label", "見やすさの設定");
      document.body.appendChild(b);
    }
    document.addEventListener("click", (e) => { const t = e.target.closest && e.target.closest("[data-a11y-open]"); if (t) { e.preventDefault(); open(); } });
    apply();
  };
  const open = () => {
    if (!dlg) build();
    lastFocus = document.activeElement;
    for (const c of dlg.querySelectorAll("input[data-k]")) c.checked = on(c.dataset.k);
    dlg.querySelector("#a11y-novoice").hidden = !(on("say") && !voice());
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
  };
  // 声の一覧はあとから届くことがある。届いたら「声がありません」を出し直す
  try { speechSynthesis.addEventListener("voiceschanged", () => { if (dlg) dlg.querySelector("#a11y-novoice").hidden = !(on("say") && !voice()); }); } catch { /* 無い端末 */ }
  apply();
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", build); else build();
  window.A11y = { on, set, open, say, stop };
})();
</script>
<!-- a11y:end -->

<script>
const {COMPANIES,EVENTS,TERMS}=window.KABU_DATA;
const TURNS=5, START=1000000, KEY="kabu-news-v1";
const RANKS=[[40,"一流トレーダー"],[20,"腕利きの投資家"],[5,"堅実な投資家"],[-5,"ほぼトントン"],[-20,"少し負け越し"],[-999,"大損"]];

// ---- 乱数と日付 ----
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function seedOf(str){let h=2166136261;for(const ch of str){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function jstDay(off=0){return new Date(Date.now()+9*3600e3-off*864e5).toISOString().slice(0,10)}
// 第何回か（2026-11-03 が第1回）。だれでも同じ回なので、友だちと見比べられる
const FIRST="2026-11-03";
function roundNo(day){return Math.round((Date.parse(day)-Date.parse(FIRST))/864e5)+1}
function md(day){return day.slice(5).replace("-","/").replace(/^0/,"").replace("/0","/")}
// 次の「今日の5本」（日本時間の0時）まで
function untilNext(){const ms=864e5-(Date.now()+9*3600e3)%864e5,h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);return h?`${h}時間${m}分`:`${m}分`}
function tick(){clearInterval(tick.h);const el=$("nextin");if(!el)return;el.textContent=untilNext();tick.h=setInterval(()=>{const e=$("nextin");if(e)e.textContent=untilNext();else clearInterval(tick.h)},3e4)}
// 1回分の5本。会社は重ねない。上げと下げは最低1本ずつ入れる（全部同じ向きだと読みが要らなくなる）
function build(seed,hard,seen){
  const r=rng(seed);
  for(let tries=0;;tries++){
    const pool=EVENTS.map((e,i)=>i);
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
    // 練習は、まだ読んでいないニュースを先に出す（同じ問題ばかりにならない）
    if(seen)pool.sort((a,b)=>(seen[EVENTS[a].n]?1:0)-(seen[EVENTS[b].n]?1:0));
    const used=new Set(),picks=[];
    for(const i of pool){const e=EVENTS[i];if(used.has(e.c))continue;used.add(e.c);picks.push(e);if(picks.length===TURNS)break}
    const ups=picks.filter(e=>e.p>0).length,tw=picks.filter(e=>e.x).length;
    // 上級は見出しの印象と逆に動く問題を2本以上
    if((ups>0&&ups<TURNS&&(!hard||tw>=2))||tries>(hard?400:20)) return withHist(picks,r);
  }
}
// ライバル「見出しどおり」：見出しの印象のとおりに半分ずつ張る（ひねった問題では外す）
function rivalMoney(list){let m=START;for(const e of list){const side=Math.sign(e.p)*(e.x?-1:1);m+=Math.round(m*.5*side*e.p/100)}return m}
function withHist(picks,r){return picks.map(e=>{const base=400+Math.floor(r()*36)*100,h=[base];
  for(let k=0;k<11;k++)h.push(Math.max(50,Math.round(h[k]*(1+(r()-.5)*.07))));return{...e,hist:h}})}
// 復習：はずれたニュースから最大5本（当てると復習の一覧から消える）
// 挑戦状：同じ5本を友だちに送る。URL の c はニュースの番号（36進）を5つ、p は出した人の成績（%）
const PAGE="https://satou-aaaaa.github.io/kabu-news/";
function chalCode(list){return list.map(e=>EVENTS.findIndex(x=>x.n===e.n).toString(36)).join("-")}
function chalParse(q){const c=q.get("c")||"",p=q.get("p");if(!/^[0-9a-z]{1,3}(-[0-9a-z]{1,3}){4}$/.test(c))return null;
  const ids=c.split("-").map(x=>parseInt(x,36));if(ids.some(i=>!(i<EVENTS.length))||new Set(ids).size!==5)return null;
  return{code:c,ids,p:/^-?\d{1,4}$/.test(p||"")?+p:null}}
function chalList(ch){return withHist(ch.ids.map(i=>EVENTS[i]),rng(seedOf(ch.code)))}
let CHAL=(()=>{try{return chalParse(new URLSearchParams(location.search))}catch{return null}})();
function dareUrl(list,pct){return PAGE+"?c="+chalCode(list)+"&p="+pct}
// 連続的中チャレンジ：全部のニュースを毎回ちがう順に（外れるまで続く）
// 会社しばりの練習：その会社のニュースから5本（毎回ちがう順）
function coList(i,seed){const r=rng(seed),l=EVENTS.filter(e=>e.c===i);for(let k=l.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[l[k],l[j]]=[l[j],l[k]]}return withHist(l.slice(0,TURNS),r)}
function survList(seed){const r=rng(seed),l=EVENTS.slice();for(let i=l.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[l[i],l[j]]=[l[j],l[i]]}return withHist(l,r)}
function reviewList(seed){const r=rng(seed),l=EVENTS.filter(e=>REC.miss[e.n]);
  for(let i=l.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[l[i],l[j]]=[l[j],l[i]]}return withHist(l.slice(0,TURNS),r)}

// ---- 記録（端末の中だけ） ----
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return{}}}
function save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch{}}
const fresh=()=>Object.assign({days:{},best:0,hits:0,bets:0,plays:0,sound:false,words:{},hdays:{},hbest:0,seen:{},co:{},tw:[0,0],ai:0,ach:{},miss:{},tm:{},sbest:0,wm:0,late:{},acur:{}},load(),(d=>d.xp==null?{xp:d.hits||0}:{})(load()));
// 今日の5本（days・cur）と上級の5本（hdays・hcur）は記録の置き場所だけがちがう
const dk=g=>g.hard?"hdays":"days",ck=g=>g.hard?"hcur":"cur";
let REC=fresh();
// 書く前に読み直す（別のタブで今日の5本を終えていたら、その記録を消さない）
function sync(){REC=fresh()}
function streak(){let n=0;for(let i=REC.days[jstDay()]?0:1;REC.days[jstDay(i)];i++)n++;return n}
function maxStreak(){let best=0,n=0,prev=0;for(const d of Object.keys(REC.days).sort()){const t=Date.parse(d);n=t-prev===864e5?n+1:1;prev=t;best=Math.max(best,n)}return best}
// あとから遊べる日：きのう〜7日前で、第1回より後、今日の5本もあとからもまだの日（新しい順）
function lateDays(rec=REC,today=jstDay()){const out=[],t=Date.parse(today);
  for(let i=1;i<=7;i++){const d=new Date(t-i*864e5).toISOString().slice(0,10);if(d>=FIRST&&!rec.days[d]&&!(rec.late||{})[d])out.push(d)}return out}
// ---- 肩書き：当てた本数（どの遊び方でも）で少しずつ上がる ----
const TITLES=[[0,"🌱","見習い"],[10,"📰","駆け出し"],[30,"📊","中堅"],[60,"🎯","腕利き"],[100,"🏅","ベテラン"],[160,"👑","名人"],[250,"🌟","伝説の読み手"]];
// 好きなだけ遊べる：連続的中チャレンジ・上級・練習は、はじめての日から遊べる（🔒で開く決まりは入れない。2026-11-06 satou さん）
const survBtn=(id,lead,home=true)=>`<button class="main alt" id="${id}">⛓️ ${lead}<small>${home?"何本続けて当てられる？":"外れるまで何本続くか"}・何度でも${home&&REC.sbest?`・最高 ${REC.sbest}本`:""}</small></button>`;
function title(xp=REC.xp){let i=TITLES.length-1;while(xp<TITLES[i][0])i--;return{i,e:TITLES[i][1],n:TITLES[i][2],next:TITLES[i+1]}}
// ---- 今週のミッション：月曜に変わる3つ（だれでも同じ） ----
function weekKey(){const wd=(new Date(Date.parse(jstDay())).getUTCDay()+6)%7;return jstDay(wd)}
const MISSIONS=[
  ["play3","📅","今日の5本を3日遊ぶ",3,c=>c.daily&&!c.hard?1:0],
  ["hit12","🎯","12本当てる",12,c=>c.hits],
  ["tw3","🔄","ひねった問題を3回当てる",3,c=>c.log.filter(l=>l.x&&l.h).length],
  ["ai3","💪","全力で3回当てる",3,c=>c.log.filter(l=>l.a&&l.h).length],
  ["hard1","⛰️","上級の5本を黒字で終える",1,c=>c.hard&&c.pct>0?1:0],
  ["p10","📈","1回で+10%以上",1,c=>c.full&&c.pct>=10?1:0],

    ${G.chal&&G.chal.p!=null?`<div class="rival"><span>挑戦状の相手は</span><b class="${G.chal.p>=0?"u":"d"}">${G.chal.p>=0?"+":""}${G.chal.p}%</b><em>${pct>G.chal.p?"あなたの勝ち":pct<G.chal.p?"相手の勝ち":"引き分け"}</em></div>`:""}
    <div class="share">${shown(text)}</div>
    ${shareRow()}
    ${!G.daily&&!G.review&&!G.late&&G.list.length===TURNS?`<button class="hardbtn" id="dare">📨 この5本で挑戦状を出す<small>友だちが同じ5本で遊べるリンク（答えは出ない）</small></button>`:""}
    ${got.length?`<div class="newach" role="status">${got.map(a=>`<div><i>${a.e}</i><span><small>実績を手に入れた</small><b>${a.n}</b></span></div>`).join("")}</div>`:""}
    ${growRow(tUp,wDone)}
    ${G.daily&&!G.hard&&!REC.hdays[day]?`<button class="hardbtn" id="hard">⛰️ 上級の5本に挑戦<small>いつも全力・ひねった問題が多め</small></button>`:""}
    ${(G.daily||G.late)&&!old?survBtn("surv",`続けて遊ぶ：連続的中チャレンジ${REC.sbest?`（最高 ${REC.sbest}本）`:""}`,false):""}
    ${G.daily?`<p class="next">次の5本まで あと <b id="nextin">${untilNext()}</b></p>`:""}
    ${recap?`<p class="sec">ふり返り</p><div class="recap">${recap}</div>`:""}
    <p class="sec">今日出てきた言葉${newWords.length?`（新しく${newWords.length}つ）`:""}</p>
    <div class="words">${G.words.map(k=>`<div class="term"><b>${TERMS[k][0]}</b>${TERMS[k][1]}</div>`).join("")}</div>
    ${fbRow(G.daily?`${G.hard?"上級 ":""}第${roundNo(day)}回`:G.late?"あとから":G.review?"復習":"練習")}
    ${G.daily&&!old&&G.money>START?`<p class="note kofi">楽しめたら、<a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener" style="color:var(--gold)">Ko-fi でコーヒー1杯の応援</a>をもらえると、新しいニュースづくりの励みになります（任意・遊ぶのはずっと無料）。</p>`:""}
    ${G.late&&lateDays().length?`<button class="ghost" id="morelate">📅 ほかの日もあとから（${lateDays().length}日）</button>`:""}
    <button class="ghost" id="again">練習でもう一回</button>
    <button class="ghost" id="tohome">記録を見る</button></div>`;
  srSay(`結果。${rank}。100万円から${man(G.money)}、${pct>=0?"プラス":"マイナス"}${Math.abs(pct)}%`);
  countUp($("tot"),0,pct,v=>`${v>=0?"+":"−"}${Math.abs(Math.round(v))}%`,900);
  beep("end");if(pct>=20)confetti();
  bindShare(text);tick();$("again").onclick=()=>start(false);if($("morelate"))$("morelate").onclick=calScreen;
  if(G.chal){CHAL=null;try{history.replaceState(null,"",location.pathname)}catch{}}
  if($("dare")){const u=dareUrl(G.list,pct);$("dare").dataset.url=u;$("dare").onclick=()=>{const t=`株ニュース5本勝負の挑戦状\nわたしは ${pct>=0?"+":""}${pct}%。同じ5本で勝てる？\n${u}`;if(navigator.share)navigator.share({text:t}).catch(()=>{});else copy(t)}}$("tohome").onclick=home;if($("hard"))$("hard").onclick=()=>start("hard");if($("surv"))$("surv").onclick=()=>start("surv");
}
// 持ち金の動き（1本ごと）。100万円の線より上は赤、下は青
function moneyLine(mh){const W=280,H=60,lo=Math.min(START,...mh),hi=Math.max(START,...mh),sp=hi-lo||1,x=i=>i*(W/(mh.length-1)),y=v=>H-(v-lo)/sp*H;
  const pts=mh.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" "),last=mh.at(-1);
  return `<svg class="mline" viewBox="-6 -6 ${W+12} ${H+12}" role="img" aria-label="持ち金の動き：${man(START)}から${man(last)}"><line x1="0" x2="${W}" y1="${y(START)}" y2="${y(START)}" stroke="#ffffff40" stroke-dasharray="4 4"/><polyline points="${pts}" fill="none" stroke="${last>=START?"var(--up)":"var(--down)"}" stroke-width="3" stroke-linejoin="round"/>${mh.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.5" fill="${i&&v<mh[i-1]?"var(--down)":i&&v>mh[i-1]?"var(--up)":"#ffffff90"}"/>`).join("")}</svg>`}
// 肩書きが上がった・今週のミッションがそろった知らせ
function growRow(tUp,wDone){const t=title(),w=wk(),ms=missions(),done=ms.filter(m=>(w.v[m[0]]||0)>=m[3]).length;
  return `<p class="sub growline">${t.e} ${t.n}${t.next?`・次の「${t.next[2]}」まで あと${t.next[0]-REC.xp}本`:""}<br>今週のミッション ${done}/3${ms.filter(m=>(w.v[m[0]]||0)<m[3]).slice(0,1).map(m=>`・次は「${m[2]}」${w.v[m[0]]||0}/${m[3]}`).join("")}</p>`+(tUp?`<div class="newach" role="status"><div><i>${tUp.e}</i><span><small>肩書きが上がった</small><b>${tUp.n}</b></span></div></div>`:"")+
  (wDone?`<div class="newach" role="status"><div><i>🏅</i><span><small>今週のミッションを3つそろえた</small><b>🏅×${REC.wm}</b></span></div></div>`:"")}
// 連続的中チャレンジの終わり：何本続いたか（共有の文に答えは出さない）
function survEnd(){
  sync();const n=G.hits,before=new Set(achs().filter(a=>a.got).map(a=>a.id)),prev=REC.sbest||0,tBefore=title().n;
  for(const l of G.log){REC.seen[l.n]=1;if(l.h)delete REC.miss[l.n];else REC.miss[l.n]=1;const c=REC.co[l.c]||(REC.co[l.c]=[0,0,0]);c[0]++;c[1]++;c[2]+=l.h}
  for(const w of G.words)REC.words[w]=1;REC.sbest=Math.max(prev,n);REC.xp+=n;
  const wDone=countWeek({hits:n,log:G.log,surv:n}),tUp=title().n!==tBefore?title():null;
  const got=achs().filter(a=>a.got&&!before.has(a.id));for(const a of got)REC.ach[a.id]=jstDay();save(REC);
  const text=`株ニュース5本勝負 連続的中チャレンジ\n⛓️ ${n}本連続${n>prev&&prev?"（自己ベスト）":""}\n${TAG}`;
  $("screen").innerHTML=`<div class="col center"><div class="rank">連続的中チャレンジ</div>
    <div class="big ${n?"u":"d"}" id="snum">${n}本</div><p class="sub">${n>prev?(prev?"自己ベスト更新！":"はじめての記録"):`最高は${prev}本`}</p>
    <div class="share">${shown(text)}</div>${shareRow()}
    ${got.length?`<div class="newach" role="status">${got.map(a=>`<div><i>${a.e}</i><span><small>実績を手に入れた</small><b>${a.n}</b></span></div>`).join("")}</div>`:""}
    ${growRow(tUp,wDone)}
    <button class="main" id="sagain">もう一度挑戦</button><button class="ghost" id="tohome">記録を見る</button></div>`;
  beep("end");if(n>prev&&n>=5)confetti();bindShare(text);$("sagain").onclick=()=>start("surv");$("tohome").onclick=home;
}
// 感想：GitHub の感想フォームを開くただのリンク（ゲームからは何も送らない。名前やメールは聞かない）
const FEEDBACK="https://github.com/satou-aaaaa/kabu-news/issues/new?template=feedback.yml";
function fbUrl(fun,title){return FEEDBACK+(fun?"&fun="+encodeURIComponent(fun):"")+"&title="+encodeURIComponent("[感想] "+(title||""))}
function fbRow(title){return `<div class="fb"><small>今日の5本はどうでしたか？</small><div>${[["😀","5 とても楽しい"],["🙂","3 ふつう"],["😕","2 いまいち"]].map(([e,f])=>`<a href="${fbUrl(f,title)}" target="_blank" rel="noopener" aria-label="${f.slice(2)}">${e}</a>`).join("")}</div><a class="fbtext" href="${fbUrl("",title)}" target="_blank" rel="noopener">感想・直してほしい所を送る</a></div>`}
// 共有：スマホは共有シートを出し、無ければコピー。X と LINE は投稿画面を開くだけ（送るのは遊ぶ人）
const TAG="#株ニュース5本勝負";
function shown(text){return text.replace(/\n?https?:\/\/\S+$/,"")}
function shareRow(){return `<button class="main" id="share">結果をシェア</button>
    <div class="shares"><a id="toX" target="_blank" rel="noopener">Xで投稿</a><a id="toLine" target="_blank" rel="noopener">LINEで送る</a><button id="copy">コピー</button></div>`}
function bindShare(text){
  const withUrl=/https?:\/\//.test(text)?text:text+"\n"+"https://satou-aaaaa.github.io/kabu-news/";
  $("toX").href="https://twitter.com/intent/tweet?text="+encodeURIComponent(withUrl);
  $("toLine").href="https://line.me/R/share?text="+encodeURIComponent(withUrl);
  $("copy").onclick=()=>copy(withUrl);
  $("share").onclick=()=>{if(navigator.share)navigator.share({text:withUrl}).catch(()=>{});else copy(withUrl)};
}
function copy(text){const ok=()=>toast("コピーしました");
  if(navigator.clipboard)navigator.clipboard.writeText(text).then(ok,()=>fallback(text));else fallback(text)}
function fallback(text){const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand("copy")}catch{}t.remove();toast(ok?"コピーしました":"コピーできませんでした。結果の文を長押ししてね")}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800)}
function confetti(){
  if(calm())return;
  const cv=$("fx"),x=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#f4c04e","#e5483d","#f6efe0","#3c7fe0"],P=Array.from({length:90},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,v:2+Math.random()*3,a:Math.random()*6,s:5+Math.random()*6,c:cols[Math.floor(Math.random()*4)]}));
  let f=0;cancelAnimationFrame(confetti.h);(function draw(){x.clearRect(0,0,cv.width,cv.height);for(const p of P){p.y+=p.v;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x+Math.sin(p.a)*8,p.y);x.rotate(p.a);x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()}if(++f<150)confetti.h=requestAnimationFrame(draw);else x.clearRect(0,0,cv.width,cv.height)})()}
// キーボード：1=買う 2=売る 3=見送る Enter=次へ
addEventListener("keydown",ev=>{if(ev.target.tagName==="INPUT")return;const m={"1":"buy","2":"sell","3":"pass"}[ev.key];if(m&&$(m)){ev.preventDefault();$(m).click()}});
$("snd").onclick=()=>{const on=!REC.sound;sync();REC.sound=on;save(REC);sndIcon();beep("tap")};
$("home").onclick=()=>{clearInterval(typeText.h);home()};
if("serviceWorker" in navigator&&location.protocol==="https:"&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register("sw.js").catch(()=>{});
window.__kabu={pracSeen,build,lateDays,seedOf,playedDays,EVENTS,COMPANIES,TERMS,TURNS,pickMissions,MISSIONS,TITLES,weekKey};
tape();sndIcon();home();
</script>

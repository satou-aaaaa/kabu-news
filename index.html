  <header><h1><button id="home" aria-label="はじめの画面へ">株ニュース5本勝負</button></h1>
    <div class="hd-r"><div class="money" id="money"></div><button class="icon" id="snd" aria-label="音"></button></div></header>
  <main id="screen" class="col"></main>
  <p class="note">会社とニュースは架空です。本当のお金は使いません。</p>

<script src="data.js"></script>
<script>
const {COMPANIES,EVENTS,TERMS}=window.KABU_DATA;
const TURNS=5, START=1000000, KEY="kabu-news-v1";
const RANKS=[[40,"一流トレーダー"],[20,"腕利きの投資家"],[5,"堅実な投資家"],[-5,"ほぼトントン"],[-20,"少し負け越し"],[-999,"大損"]];

// ---- 乱数と日付 ----
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function seedOf(str){let h=2166136261;for(const ch of str){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function jstDay(off=0){return new Date(Date.now()+9*3600e3-off*864e5).toISOString().slice(0,10)}
// 第何回か（2026-11-03 が第1回）。だれでも同じ回なので、友だちと見比べられる
const FIRST="2026-11-03";
function roundNo(day){return Math.round((Date.parse(day)-Date.parse(FIRST))/864e5)+1}
function md(day){return day.slice(5).replace("-","/").replace(/^0/,"").replace("/0","/")}
// 次の「今日の5本」（日本時間の0時）まで
function untilNext(){const ms=864e5-(Date.now()+9*3600e3)%864e5,h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);return h?`${h}時間${m}分`:`${m}分`}
function tick(){clearInterval(tick.h);const el=$("nextin");if(!el)return;el.textContent=untilNext();tick.h=setInterval(()=>{const e=$("nextin");if(e)e.textContent=untilNext();else clearInterval(tick.h)},3e4)}
// 1回分の5本。会社は重ねない。上げと下げは最低1本ずつ入れる（全部同じ向きだと読みが要らなくなる）
function build(seed,hard,seen){
  const r=rng(seed);
  for(let tries=0;;tries++){
    const pool=EVENTS.map((e,i)=>i);
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
    // 練習は、まだ読んでいないニュースを先に出す（同じ問題ばかりにならない）
    if(seen)pool.sort((a,b)=>(seen[EVENTS[a].n]?1:0)-(seen[EVENTS[b].n]?1:0));
    const used=new Set(),picks=[];
    for(const i of pool){const e=EVENTS[i];if(used.has(e.c))continue;used.add(e.c);picks.push(e);if(picks.length===TURNS)break}
    const ups=picks.filter(e=>e.p>0).length,tw=picks.filter(e=>e.x).length;
    // 上級は見出しの印象と逆に動く問題を2本以上
    if((ups>0&&ups<TURNS&&(!hard||tw>=2))||tries>(hard?400:20)) return withHist(picks,r);
  }
}
// ライバル「見出しどおり」：見出しの印象のとおりに半分ずつ張る（ひねった問題では外す）
function rivalMoney(list){let m=START;for(const e of list){const side=Math.sign(e.p)*(e.x?-1:1);m+=Math.round(m*.5*side*e.p/100)}return m}
function withHist(picks,r){return picks.map(e=>{const base=400+Math.floor(r()*36)*100,h=[base];
  for(let k=0;k<11;k++)h.push(Math.max(50,Math.round(h[k]*(1+(r()-.5)*.07))));return{...e,hist:h}})}
// 復習：はずれたニュースから最大5本（当てると復習の一覧から消える）
// 挑戦状：同じ5本を友だちに送る。URL の c はニュースの番号（36進）を5つ、p は出した人の成績（%）
const PAGE="https://satou-aaaaa.github.io/kabu-news/";
function chalCode(list){return list.map(e=>EVENTS.findIndex(x=>x.n===e.n).toString(36)).join("-")}
function chalParse(q){const c=q.get("c")||"",p=q.get("p");if(!/^[0-9a-z]{1,3}(-[0-9a-z]{1,3}){4}$/.test(c))return null;
  const ids=c.split("-").map(x=>parseInt(x,36));if(ids.some(i=>!(i<EVENTS.length))||new Set(ids).size!==5)return null;
  return{code:c,ids,p:/^-?\d{1,4}$/.test(p||"")?+p:null}}
function chalList(ch){return withHist(ch.ids.map(i=>EVENTS[i]),rng(seedOf(ch.code)))}
let CHAL=(()=>{try{return chalParse(new URLSearchParams(location.search))}catch{return null}})();
function dareUrl(list,pct){return PAGE+"?c="+chalCode(list)+"&p="+pct}
// 連続的中チャレンジ：全部のニュースを毎回ちがう順に（外れるまで続く）
function survList(seed){const r=rng(seed),l=EVENTS.slice();for(let i=l.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[l[i],l[j]]=[l[j],l[i]]}return withHist(l,r)}
function reviewList(seed){const r=rng(seed),l=EVENTS.filter(e=>REC.miss[e.n]);
  for(let i=l.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[l[i],l[j]]=[l[j],l[i]]}return withHist(l.slice(0,TURNS),r)}

// ---- 記録（端末の中だけ） ----

function fbRow(title){return `<div class="fb"><small>今日の5本はどうでしたか？</small><div>${[["😀","5 とても楽しい"],["🙂","3 ふつう"],["😕","2 いまいち"]].map(([e,f])=>`<a href="${fbUrl(f,title)}" target="_blank" rel="noopener" aria-label="${f.slice(2)}">${e}</a>`).join("")}</div><a class="fbtext" href="${fbUrl("",title)}" target="_blank" rel="noopener">感想・直してほしい所を送る</a></div>`}
// 共有：スマホは共有シートを出し、無ければコピー。X と LINE は投稿画面を開くだけ（送るのは遊ぶ人）
const TAG="#株ニュース5本勝負";
function shown(text){return text.replace(/\n?https?:\/\/\S+$/,"")}
function shareRow(){return `<button class="main" id="share">結果をシェア</button>
    <div class="shares"><a id="toX" target="_blank" rel="noopener">Xで投稿</a><a id="toLine" target="_blank" rel="noopener">LINEで送る</a><button id="copy">コピー</button></div>`}
function bindShare(text){
  const withUrl=/https?:\/\//.test(text)?text:text+"\n"+"https://satou-aaaaa.github.io/kabu-news/";
  $("toX").href="https://twitter.com/intent/tweet?text="+encodeURIComponent(withUrl);
  $("toLine").href="https://line.me/R/share?text="+encodeURIComponent(withUrl);
  $("copy").onclick=()=>copy(withUrl);
  $("share").onclick=()=>{if(navigator.share)navigator.share({text:withUrl}).catch(()=>{});else copy(withUrl)};
}
function copy(text){const ok=()=>toast("コピーしました");
  if(navigator.clipboard)navigator.clipboard.writeText(text).then(ok,()=>fallback(text));else fallback(text)}
function fallback(text){const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand("copy")}catch{}t.remove();toast(ok?"コピーしました":"コピーできませんでした。結果の文を長押ししてね")}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800)}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=$("fx"),x=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#f4c04e","#e5483d","#f6efe0","#3c7fe0"],P=Array.from({length:90},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,v:2+Math.random()*3,a:Math.random()*6,s:5+Math.random()*6,c:cols[Math.floor(Math.random()*4)]}));
  let f=0;cancelAnimationFrame(confetti.h);(function draw(){x.clearRect(0,0,cv.width,cv.height);for(const p of P){p.y+=p.v;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x+Math.sin(p.a)*8,p.y);x.rotate(p.a);x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()}if(++f<150)confetti.h=requestAnimationFrame(draw);else x.clearRect(0,0,cv.width,cv.height)})()}
// キーボード：1=買う 2=売る 3=見送る Enter=次へ
addEventListener("keydown",ev=>{if(ev.target.tagName==="INPUT")return;const m={"1":"buy","2":"sell","3":"pass"}[ev.key];if(m&&$(m)){ev.preventDefault();$(m).click()}});
$("snd").onclick=()=>{const on=!REC.sound;sync();REC.sound=on;save(REC);sndIcon();beep("tap")};
$("home").onclick=()=>{clearInterval(typeText.h);home()};
if("serviceWorker" in navigator&&location.protocol==="https:"&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register("sw.js").catch(()=>{});
window.__kabu={build,EVENTS,COMPANIES,TERMS,TURNS,pickMissions,MISSIONS,TITLES,weekKey};
tape();sndIcon();home();
</script>
